name: pdf-rag-v4

services:
  backend:
    build: ./be
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --log-level
      - ${UVICORN_LOG_LEVEL:-debug}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      UVICORN_LOG_LEVEL: ${UVICORN_LOG_LEVEL:-debug}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_ROUTER_MODEL: ${OLLAMA_ROUTER_MODEL:-qwen2.5:0.5b}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:8b}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-pdf_chunks}
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-120}
      CHAT_CONTEXT_MESSAGES: ${CHAT_CONTEXT_MESSAGES:-10}
      CHAT_CONTEXT_CHARACTERS: ${CHAT_CONTEXT_CHARACTERS:-6000}
      ROUTER_CONTEXT_MESSAGES: ${ROUTER_CONTEXT_MESSAGES:-2}
      ROUTER_CONTEXT_CHARACTERS: ${ROUTER_CONTEXT_CHARACTERS:-1500}
      ROUTER_TIMEOUT_SECONDS: ${ROUTER_TIMEOUT_SECONDS:-20}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-10}
      RETRIEVAL_RELATIVE_THRESHOLD: ${RETRIEVAL_RELATIVE_THRESHOLD:-0.7}
      RETRIEVAL_FINAL_K: ${RETRIEVAL_FINAL_K:-4}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      UPLOADS_DIR: /app/uploads
      DATA_DIR: /app/data
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/uploads
      - backend_data:/app/data
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant_storage:/qdrant/storage
    # Reachable by backend over the Compose network; no host port needed.

volumes:
  uploads:
  backend_data:
  qdrant_storage:
